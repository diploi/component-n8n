apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    matchLabels:
      app: app
  strategy:
  {{- if eq .Values.stage "development"}}
    type: Recreate
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  {{- end }}
  replicas: {{ ternary 1 0 .Values.enabled }}
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: diploi-pull-secret
      containers:
        - name: app
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          # n8n needs its database, which the setup container creates. tini and the entrypoint are the image's own.
          command: ['tini', '--', '/bin/sh', '-c', 'until [ -f /diploi-state/database-ready ]; do sleep 1; done; exec /docker-entrypoint.sh']
          ports:
            - containerPort: 5678
          env:
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
            {{- if eq .Values.envMap.DIPLOI_AI_ENABLED.value "true" }}
            # n8n Assistant through the Diploi AI proxy
            - name: N8N_INSTANCE_AI_MODEL
              value: {{ .Values.envMap.DIPLOI_AI_MODEL.value | quote }}
            - name: N8N_INSTANCE_AI_MODEL_URL
              value: {{ .Values.envMap.DIPLOI_AI_URL.value | quote }}
            - name: N8N_INSTANCE_AI_MODEL_API_KEY
              value: {{ .Values.envMap.DIPLOI_AI_TOKEN.value | quote }}
            {{- end }}
          # The first start migrates the database, which takes minutes on a small core
          startupProbe:
            httpGet:
              path: /healthz/readiness
              port: 5678
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - name: state
              mountPath: /diploi-state
        # Creates the database, sets n8n up on its first start and gives the prompt tab's agent and the AI nodes access, then waits
        - name: setup
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '/diploi/setup.sh']
          env:
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /diploi
              readOnly: true
            - name: state
              mountPath: /diploi-state
      volumes:
        - name: scripts
          configMap:
            name: app-scripts
        - name: state
          emptyDir: {}
